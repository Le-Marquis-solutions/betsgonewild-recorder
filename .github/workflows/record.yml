name: Record navigation videos

on:
  push:
    paths:
      - 'requests/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record every pending request
        run: |
          mkdir -p recordings
          for f in requests/*.json; do
            slug=$(node -pe "JSON.parse(require('fs').readFileSync('$f','utf8')).slug")
            if [ -f "recordings/$slug.webm" ]; then
              echo "skip $slug (already recorded)"
            else
              echo "recording $slug from $f"
              node record.mjs "$f" || echo "FAILED: $slug"
            fi
          done

      - name: Commit recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recordings/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "recording: $(ls recordings/*.webm | xargs -n1 basename | tr '\n' ' ')"
            git push
          fi
